# Application Configuration
spring.application.name=movie-streaming-api

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/movie_streaming_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# API Configuration
api.prefix=/api/v1

# JWT Configuration (CRITICAL: Set JWT_SECRET_KEY environment variable in production)
jwt.secret-key=${JWT_SECRET_KEY:}
jwt.access-token-expiration=${JWT_EXPIRATION_MS:86400000}

# Logging Configuration
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.hoaug.movieapi.modules.auth=${LOG_LEVEL_AUTH:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART:true}

# Email Configuration
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application URLs
app.url.base=${APP_BASE_URL:http://localhost:3000}
app.url.reset-password=${APP_RESET_PASSWORD_URL:http://localhost:3000/reset-password?token=}
app.url.email-verification=${APP_EMAIL_VERIFICATION_URL:http://localhost:3000/verify?email=}

# Email Sender (configured via @ConfigurationProperties)
# mail.from.email=${MAIL_FROM_EMAIL:noreply@giophim.com}
# mail.from.name=${MAIL_FROM_NAME:Gio Phim}

# Actuator & Monitoring
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_INCLUDE:health,info,metrics}
management.endpoint.health.show-details=when-authorized

# PayOS Payment Gateway (Get from PayOS Dashboard)
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# CallBack URLs
payos.return-url=${PAYOS_RETURN_URL:http://localhost:3000/subscription/success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:3000/subscription/cancel}
payos.webhook-url=${PAYOS_WEBHOOK_URL:http://localhost:8080/api/v1/webhooks/payment}