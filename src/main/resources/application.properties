# Application Configuration
spring.application.name=movie-streaming-api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:movie_streaming_platform}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# API Configuration
api.prefix=${API_PREFIX:/api/v1}

# JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:86400000}

# Logging Configuration
logging.level.com.hoaug.movieapi.modules.auth=DEBUG
logging.level.org.springframework.security=DEBUG

spring.devtools.restart.enabled=true