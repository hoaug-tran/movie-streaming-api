# Application Configuration
spring.application.name=movie-streaming-api

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/movie_streaming_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
logging.level.org.springframework.data.redis=ERROR
logging.level.org.springframework.data.repository.config=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.jpa.open-in-view=false

# API Configuration
api.prefix=/api/v1

# JWT Configuration (CRITICAL: Set JWT_SECRET_KEY environment variable in production)
jwt.secret-key=${JWT_SECRET_KEY:}
jwt.access-token-expiration=${JWT_EXPIRATION_MS:86400000}

# Logging Configuration
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.hoaug.movieapi.modules.auth=${LOG_LEVEL_AUTH:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART:true}

# Email Configuration
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application URLs
app.url.base=${APP_BASE_URL:http://localhost:3000}
app.url.api-base=${APP_API_BASE_URL:http://localhost:8080}
app.url.media-base=${APP_MEDIA_BASE_URL:http://localhost}
app.url.reset-password=${APP_RESET_PASSWORD_URL:${app.url.base}/reset-password?token=}
app.url.email-verification=${APP_EMAIL_VERIFICATION_URL:${app.url.base}/verify?email=}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.cookie.domain=${APP_COOKIE_DOMAIN:}
# Email Sender
mail.from.email=${MAIL_FROM_EMAIL:noreply@giophim.libsys.me}
mail.from.name=${MAIL_FROM_NAME:Gió Phim}

# Support Inbox
app.support.inbox.primary=${SUPPORT_INBOX_PRIMARY:hi@trkhoang.com}
app.support.inbox.secondary=${SUPPORT_INBOX_SECONDARY:hoaug@duck.com}

# Avatar Storage
app.storage.avatar.directory=${AVATAR_STORAGE_DIRECTORY:}
app.storage.avatar.public-base-url=${AVATAR_PUBLIC_BASE_URL:${app.url.media-base}/avatar}
app.storage.avatar.max-bytes=${AVATAR_MAX_BYTES:5242880}

# Media Storage / Soft-DRM HLS
app.storage.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:${app.url.media-base}}
app.storage.media.movies-data-directory=${MEDIA_MOVIES_DATA_DIRECTORY:F:/movie-storage/data/movies}
app.storage.media.series-data-directory=${MEDIA_SERIES_DATA_DIRECTORY:F:/movie-storage/data/series}
app.storage.media.ads-data-directory=${MEDIA_ADS_DATA_DIRECTORY:F:/movie-storage/data/ads}
app.storage.media.others-data-directory=${MEDIA_OTHERS_DATA_DIRECTORY:F:/movie-storage/data/others}
app.storage.media.hls-directory=${MEDIA_HLS_DIRECTORY:F:/movie-storage/hls}
app.storage.media.keys-directory=${MEDIA_KEYS_DIRECTORY:F:/movie-storage/keys}
app.storage.media.max-upload-bytes=${MEDIA_MAX_UPLOAD_BYTES:5368709120}
app.storage.media.ffmpeg-path=${FFMPEG_PATH:tools/ffmpeg/bin/ffmpeg.exe}

# Actuator & Monitoring
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_INCLUDE:health,info,metrics}
management.endpoint.health.show-details=when-authorized

# PayOS Payment Gateway (Get from PayOS Dashboard)
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# CallBack URLs
payos.return-url=${PAYOS_RETURN_URL:${app.url.base}/subscription/success}
payos.cancel-url=${PAYOS_CANCEL_URL:${app.url.base}/subscription/cancel}
payos.webhook-url=${PAYOS_WEBHOOK_URL:${app.url.api-base}/api/v1/webhooks/payment}

# Redis Configuration for Caching
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.jedis.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.jedis.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.jedis.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.data.redis.jedis.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1ms}

# OAuth Configuration (Google OAuth)
oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI:${app.url.api-base}/api/v1/auth/oauth/callback}
oauth.google.scopes=openid email profile

# PayOS Configuration
app.payment.reconciliation.fixed-delay-ms=300000
app.payment.reconciliation.initial-delay-ms=60000

# Multipart / File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:100GB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:100GB}
spring.servlet.multipart.file-size-threshold=${MULTIPART_FILE_SIZE_THRESHOLD:100GB}

# PWA Web Push (VAPID) - generate with: npx web-push generate-vapid-keys
vapid.public-key=${VAPID_PUBLIC_KEY}
vapid.private-key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT:mailto:noreply@giophim.libsys.me}
