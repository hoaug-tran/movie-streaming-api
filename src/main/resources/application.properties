# Application Configuration
spring.application.name=movie-streaming-api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/movie_streaming_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# API Configuration
api.prefix=/api/v1

# JWT Configuration
jwt.access-token-expiration=86400000

# Logging Configuration
logging.level.com.hoaug.movieapi.modules.auth=DEBUG
logging.level.org.springframework.security=DEBUG

spring.devtools.restart.enabled=true

# Email Configuration - Mailtrap Sandbox SMTP
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application URLs
app.url.base=http://localhost:3000
app.url.reset-password=http://localhost:3000/reset-password?token=
app.url.email-verification=http://localhost:3000/verify?email=

# Email Sender
mail.from.email=noreply@movieplatform.com
mail.from.name=Gio Phim