spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/movie_streaming_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial schema created by Hibernate"
    validate-on-migrate: false
