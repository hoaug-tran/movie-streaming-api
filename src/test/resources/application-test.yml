spring:
  application:
    name: movie-streaming-api

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true
        "[use_sql_comments]": true

  jackson:
    default-property-inclusion: non_null

  # Test configuration removed (not a standard Spring Boot property)

  cache:
    type: simple

# Custom application properties (defined in @ConfigurationProperties classes)
# jwt:
#   secret: ${JWT_SECRET:test-secret-key-for-jwt-testing-purposes-minimum-256-bits}
#   expiration: 3600000
# api:
#   prefix: /api/v1

logging:
  level:
    root: WARN
    "[com.hoaug.movieapi]": DEBUG
    "[org.springframework.web]": WARN
    "[org.hibernate]": WARN
